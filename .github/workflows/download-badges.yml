# ============================================================================
#  download-badges.yml
#  ----------------------------------------------------------------------------
#  Writes shields.io "endpoint" JSON for each PyPI package's monthly download
#  count into badges/ on main.
#
#  Why not just use img.shields.io/pepy/dt/<pkg>?
#    pepy rate-limits hard. With six download badges on one page, most visitors
#    get "rate limited by upstream service" instead of a number — worse than
#    showing nothing. Generating the JSON here means shields only ever reads
#    raw.githubusercontent, which doesn't rate-limit.
#
#    This is the same trick patchnotes already uses for its changelog badge.
#
#  Source: pypistats.org (free, no API key, last-30-day totals).
#
#  Output: badges/<package>.json  →  embed with
#    https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/Londopy/Londopy/main/badges/<package>.json
#
#  Permissions needed: contents: write.
# ============================================================================

name: Refresh download badges

on:
  schedule:
    - cron: "0 3 * * *"      # 03:00 UTC — staggered clear of the other jobs
  workflow_dispatch:

# Every workflow that writes to main shares this group, so they queue instead
# of racing each other.
concurrency:
  group: profile-main-writes
  cancel-in-progress: false

jobs:
  badges:
    name: Build download badge JSON
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch download counts and write badge JSON
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          PACKAGES = [
              "ropesim", "patchnotes", "deadpoint", "drugdose",
              "timefuzz", "pygeospy", "vitalscore",
              "hide-desktop-apps", "akribia", "valotracker",
          ]

          # Amber for the headline number, matching the profile palette.
          COLOR = "D97706"

          os.makedirs("badges", exist_ok=True)

          def human(n):
              if n >= 1_000_000:
                  return f"{n/1_000_000:.1f}M".replace(".0M", "M")
              if n >= 1_000:
                  return f"{n/1_000:.1f}k".replace(".0k", "k")
              return str(n)

          total = 0
          for pkg in PACKAGES:
              url = f"https://pypistats.org/api/packages/{pkg}/recent"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Londopy-profile-badges"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      count = json.load(r)["data"]["last_month"]
              except Exception as e:
                  print(f"  !! {pkg}: {e} — leaving existing badge alone")
                  continue

              total += count
              payload = {
                  "schemaVersion": 1,
                  "label": "downloads",
                  "message": f"{human(count)}/month",
                  "color": COLOR,
              }
              with open(f"badges/{pkg}.json", "w") as f:
                  json.dump(payload, f)
              print(f"  {pkg:<20} {count:>8,}/month")

              time.sleep(2)   # be polite to pypistats

          # One combined badge for the profile header.
          with open("badges/_total.json", "w") as f:
              json.dump({
                  "schemaVersion": 1,
                  "label": "PyPI downloads",
                  "message": f"{human(total)}/month",
                  "color": "4A7B3E",
              }, f)
          print(f"\n  TOTAL {total:,}/month across {len(PACKAGES)} packages")
          PY

      - name: Commit & push (rebase-safe)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add badges/
          if git diff --staged --quiet; then
            echo "nothing changed — nothing to do"
            exit 0
          fi
          git commit -m "chore(profile): refresh download badges"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed — someone else got there first, retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
