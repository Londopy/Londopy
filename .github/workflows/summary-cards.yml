# ============================================================================
#  summary-cards.yml
#  ----------------------------------------------------------------------------
#  Generates profile stat cards as SVGs committed into
#  `profile-summary-card-output/` on main.
#
#  NOTE ON AUTO_PUSH
#    The action defaults to AUTO_PUSH: true and pushes to main itself, with no
#    rebase. When several profile workflows run at once they all check out the
#    same SHA and only the first push wins — the rest die on non-fast-forward.
#    So we set AUTO_PUSH: false and do the push here, with a rebase-retry loop.
#
#  Output (one folder per theme):
#    profile-summary-card-output/gruvbox/0-profile-details.svg
#                                       /1-repos-per-language.svg
#                                       /2-most-commit-language.svg
#                                       /3-stats.svg
#                                       /4-productive-time.svg
#
#  Permissions needed: contents: write.
# ============================================================================

name: Generate profile summary cards

on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC — staggered clear of the other jobs
  workflow_dispatch:

# Every workflow that writes to main shares this group, so they queue instead
# of racing each other.
concurrency:
  group: profile-main-writes
  cancel-in-progress: false

jobs:
  summary-cards:
    name: Generate summary cards
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: "-8"        # Pacific. Use "-7" if you'd rather track PDT.
          AUTO_PUSH: false        # we push below instead — see note above

      - name: Commit & push (rebase-safe)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add profile-summary-card-output/
          if git diff --staged --quiet; then
            echo "no card changes — nothing to do"
            exit 0
          fi
          git commit -m "chore(profile): refresh summary cards"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed — someone else got there first, retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
